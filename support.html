<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dreamliner Assistant</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{height:100vh;background:#f4f7fb;overflow:hidden;}

.header{
position:fixed;top:0;left:0;right:0;height:56px;
display:flex;align-items:center;justify-content:space-between;
padding:0 9px;background:linear-gradient(135deg,#ff7a00,#ff3d2e);
color:#fff;font-weight:600;z-index:1000;
}

.lang-box{display:flex;gap:6px;}
.lang-box button{border:none;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;}
.lang-box button.active{background:#222;color:#fff;}
.lang-box button:not(.active){background:#fff;color:#ff3d2e;}

.chat-container{
position:absolute;top:56px;bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;
overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;
}

.message{
max-width:80%;padding:10px 12px;border-radius:14px;
font-size:13px;line-height:1.5;word-break:break-word;
}

.bot{background:#fff;align-self:flex-start;}
.user{background:#ff6a00;color:#fff;align-self:flex-end;}

.input-area{
position:fixed;bottom:0;left:0;right:0;height:calc(64px + env(safe-area-inset-bottom));
display:flex;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;
}

.input-area input{
flex:1;border:none;outline:none;padding:10px;border-radius:10px;background:#f3f5f9;
}

.input-area button{
width:44px;border:none;border-radius:10px;background:#ff7a00;color:#fff;cursor:pointer;
}

.options button{
display:block;width:100%;margin-top:6px;padding:10px;border:none;
border-radius:10px;background:#f2f2f2;cursor:pointer;font-weight:600;
}

.options button:hover{background:#ffe7d1;color:#ff3d2e;}

.end-card{
background:#ffffff;padding:14px;border-radius:18px;font-size:13px;
box-shadow:0 8px 24px rgba(15,23,42,0.10);width:88%;border:1px solid #eef0f4;
}

.end-card strong{display:block;font-size:14px;color:#222;margin-bottom:10px;}
.action-buttons{display:grid;grid-template-columns:1fr;gap:10px;}

.action-buttons button{
border:none;padding:12px 14px;border-radius:14px;font-weight:650;
font-size:13px;cursor:pointer;display:flex;align-items:center;
justify-content:center;gap:8px;transition:0.2s ease;
}

.chat-again-btn{background:#fff3e8;color:#e65300;border:1px solid #ffd8b8 !important;}
.employee-btn{background:#eafff2;color:#128c43;border:1px solid #bff0d1 !important;}

.action-buttons button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,0.08);}
.action-buttons button:active{transform:scale(0.98);}

.typing{display:flex;align-items:center;gap:5px;padding:12px;width:58px;}
.dot{width:7px;height:7px;background:#ff7a00;border-radius:50%;animation:bounce 1s infinite;}

.back-btn{
width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,0.25);
background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);
display:flex;align-items:center;justify-content:center;margin-right:15px;color:white;cursor:pointer;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-4px);}
}
</style>
</head>

<body>

<div class="header">
<button class="back-btn" onclick="appBack()">
<i class="fas fa-chevron-left"></i>
</button>

<div>🤖 Dreamliner Assistant</div>

<div class="lang-box">
<button id="enBtn" class="active" onclick="setLang('en')">EN</button>
<button id="hiBtn" onclick="setLang('hi')">HI</button>
</div>
</div>

<div class="chat-container" id="chat">
<div class="message bot" id="welcome"></div>
<div class="message bot" id="options"></div>
</div>

<div class="input-area">
<input id="question" placeholder="">   
<button onclick="sendMessage()"><i class="fa fa-paper-plane"></i></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "dreamliner-421b0",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

let db = null;
try{
const app = initializeApp(firebaseConfig);
db = getFirestore(app);
}catch(e){
db = null;
}

const LANG = {
en:{
welcome:"Welcome to Dreamliner. I'm your travel assistant🙏🏼.",
choose:"Choose an option:",
book:"Book Ticket",
cancel:"Cancel Ticket",
refund:"Refund Policy",
boarding:"Boarding Info",
reschedule:"Reschedule Journey",
support:"Support",
input:"Type your message...",
whatNext:"What next?",
chatAgain:"Chat Again",
employee:"Chat with Employee",
invalid:"Sorry, I can help only with the options below. Please select one from here:"
},
hi:{
welcome:"ड्रीमलाइन में आपका स्वागत है। मैं आपका ट्रैवल असिस्टेंट हूँ।🙏🏼",
choose:"एक विकल्प चुनें:",
book:"टिकट बुक करें",
cancel:"टिकट रद्द करें",
refund:"रिफंड नीति",
boarding:"बोर्डिंग जानकारी",
reschedule:"यात्रा पुनः निर्धारित करें",
support:"सहायता",
input:"अपना संदेश लिखें...",
whatNext:"आगे क्या?",
chatAgain:"फिर से चैट करें",
employee:"कर्मचारी से चैट करें",
invalid:"माफ़ करें, मैं केवल नीचे दिए गए विकल्पों में मदद कर सकता हूँ। कृपया यहाँ से एक विकल्प चुनें:"
}
};

const LOCAL_ANSWERS = {
en:{
book:`<strong>How to book your ticket:</strong><br>Step 1: Select boarding point and destination.<br>Step 2: Select journey date and bus.<br>Step 3: Choose your seat.<br>Step 4: Add passenger details and complete payment.<br>After successful payment, your ticket will be downloaded and saved in My Trips/Profile.`,
cancel:`<strong>How to cancel your ticket:</strong><br>Open Profile / My Trips, search your booking, then tap Cancel Ticket.<br>Cancellation is allowed according to the refund policy and journey time.`,
refund:`<strong>Refund Policy:</strong><br>More than 48 hours before journey: 90% refund.<br>24 to 48 hours: 80% refund.<br>12 to 24 hours: 50% refund.<br>Less than 12 hours: no refund.<br>Refund processing usually takes 5–6 working days.`,
boarding:`<strong>Boarding Information:</strong><br>Your M-ticket is valid for boarding.<br>Please reach the pickup point at least 15 minutes before departure.<br>Carry a valid government ID proof with your ticket.`,
reschedule:`<strong>Reschedule Journey:</strong><br>You can reschedule once from Profile / My Trips.<br>Reschedule is allowed up to 12 hours before departure.<br>Select the new date, trip, and same number of seats.`,
support:`<strong>Support:</strong><br>You can chat with our employee on WhatsApp for booking, cancellation, refund, boarding, or reschedule help.<br>Tap “Chat with Employee” below.`
},
hi:{
book:`<strong>टिकट बुक करने का तरीका:</strong><br>Step 1: बोर्डिंग पॉइंट और डेस्टिनेशन चुनें।<br>Step 2: यात्रा की तारीख और बस चुनें।<br>Step 3: सीट चुनें।<br>Step 4: यात्री जानकारी भरकर पेमेंट पूरा करें।<br>पेमेंट के बाद टिकट डाउनलोड होगा और My Trips/Profile में दिखेगा।`,
cancel:`<strong>टिकट रद्द करने का तरीका:</strong><br>Profile / My Trips खोलें, अपनी बुकिंग खोजें और Cancel Ticket पर टैप करें।<br>कैंसिलेशन रिफंड पॉलिसी और यात्रा समय के अनुसार होगा।`,
refund:`<strong>रिफंड नीति:</strong><br>48 घंटे से अधिक पहले: 90% रिफंड।<br>24 से 48 घंटे: 80% रिफंड।<br>12 से 24 घंटे: 50% रिफंड।<br>12 घंटे से कम: कोई रिफंड नहीं।<br>रिफंड में सामान्यतः 5–6 working days लगते हैं।`,
boarding:`<strong>बोर्डिंग जानकारी:</strong><br>M-ticket बोर्डिंग के लिए मान्य है।<br>कृपया departure से कम से कम 15 मिनट पहले pickup point पर पहुंचें।<br>टिकट के साथ सरकारी ID proof रखें।`,
reschedule:`<strong>यात्रा Reschedule:</strong><br>आप Profile / My Trips से एक बार journey reschedule कर सकते हैं।<br>Departure से 12 घंटे पहले तक reschedule allowed है।<br>नई date, trip और same seat count चुनें।`,
support:`<strong>सहायता:</strong><br>Booking, cancellation, refund, boarding या reschedule help के लिए WhatsApp पर employee से chat करें।<br>नीचे “कर्मचारी से चैट करें” टैप करें।`
}
};

let currentLang = "en";

function sendToApp(payload){
try{
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify(payload));
return true;
}
}catch(e){}
return false;
}

function appBack(){
stopVoice();
if(sendToApp({type:"APP_GO_BACK"})) return;
if(history.length > 1){ history.back(); } else { location.href = "index.html"; }
}

function getUserQuestion(type){
const questions = {
en:{
book:"How can I book a ticket?",
cancel:"How can I cancel my ticket?",
refund:"What is the refund policy?",
boarding:"What is the boarding information?",
reschedule:"How can I reschedule my journey?",
support:"How can I contact support?"
},
hi:{
book:"मैं टिकट कैसे बुक कर सकता हूँ?",
cancel:"मैं अपना टिकट कैसे रद्द कर सकता हूँ?",
refund:"रिफंड नीति क्या है?",
boarding:"बोर्डिंग जानकारी क्या है?",
reschedule:"मैं अपनी यात्रा पुनः कैसे निर्धारित कर सकता हूँ?",
support:"मैं सहायता से कैसे संपर्क कर सकता हूँ?"
}
};
return questions[currentLang][type];
}

function detectOption(text){
text = text.toLowerCase();
if(text.includes("book") || text.includes("ticket book") || text.includes("टिकट बुक")) return "book";
if(text.includes("cancel") || text.includes("टिकट रद्द") || text.includes("रद्द")) return "cancel";
if(text.includes("refund") || text.includes("रिफंड")) return "refund";
if(text.includes("boarding") || text.includes("board") || text.includes("बोर्डिंग")) return "boarding";
if(text.includes("reschedule") || text.includes("change journey") || text.includes("यात्रा पुनः")) return "reschedule";
if(text.includes("support") || text.includes("help") || text.includes("सहायता")) return "support";
return null;
}

function loadUI(){
document.getElementById("welcome").innerText = LANG[currentLang].welcome;
document.getElementById("question").placeholder = LANG[currentLang].input;
document.getElementById("options").innerHTML = `
<strong>${LANG[currentLang].choose}</strong>
<div class="options">
<button onclick="ask('book')">${LANG[currentLang].book}</button>
<button onclick="ask('cancel')">${LANG[currentLang].cancel}</button>
<button onclick="ask('refund')">${LANG[currentLang].refund}</button>
<button onclick="ask('boarding')">${LANG[currentLang].boarding}</button>
<button onclick="ask('reschedule')">${LANG[currentLang].reschedule}</button>
<button onclick="ask('support')">${LANG[currentLang].support}</button>
</div>
`;
}

function showOptionsAgain(){
const chat = document.getElementById("chat");
chat.innerHTML += `
<div class="message bot">
<strong>${LANG[currentLang].choose}</strong>
<div class="options">
<button onclick="ask('book')">${LANG[currentLang].book}</button>
<button onclick="ask('cancel')">${LANG[currentLang].cancel}</button>
<button onclick="ask('refund')">${LANG[currentLang].refund}</button>
<button onclick="ask('boarding')">${LANG[currentLang].boarding}</button>
<button onclick="ask('reschedule')">${LANG[currentLang].reschedule}</button>
<button onclick="ask('support')">${LANG[currentLang].support}</button>
</div>
</div>
`;
chat.scrollTop = chat.scrollHeight;
}

function setLang(lang){
currentLang = lang;
document.getElementById("enBtn").classList.remove("active");
document.getElementById("hiBtn").classList.remove("active");
document.getElementById(lang + "Btn").classList.add("active");
loadUI();
}

async function ask(type){
await sendMessage(type);
}

async function getFirebaseAnswer(type){
try{
if(!db) return LOCAL_ANSWERS[currentLang][type];
const snap = await getDoc(doc(db, "supportAnswers", type));
if(!snap.exists()) return LOCAL_ANSWERS[currentLang][type];
const data = snap.data();
if(data.active === false) return LOCAL_ANSWERS[currentLang][type];
return data[currentLang]?.answer || data.en?.answer || LOCAL_ANSWERS[currentLang][type];
}catch(e){
return LOCAL_ANSWERS[currentLang][type];
}
}

async function sendMessage(type = null){
const input = document.getElementById("question");
const chat = document.getElementById("chat");
const typedText = input.value.trim();
if(!type && !typedText) return;

if(!type){
const matchedType = detectOption(typedText);
chat.innerHTML += `<div class="message user">${typedText}</div>`;
input.value = "";
chat.scrollTop = chat.scrollHeight;
if(matchedType){
type = matchedType;
}else{
chat.innerHTML += `<div class="message bot">${LANG[currentLang].invalid}</div>`;
showOptionsAgain();
chat.scrollTop = chat.scrollHeight;
return;
}
}else{
chat.innerHTML += `<div class="message user">${getUserQuestion(type)}</div>`;
input.value = "";
chat.scrollTop = chat.scrollHeight;
}

showTyping();
setTimeout(async ()=>{
const answer = await getFirebaseAnswer(type);
removeTyping();
chat.innerHTML += `
<div class="message bot">${answer}</div>
<div class="message bot end-card">
<strong>${LANG[currentLang].whatNext}</strong>
<div class="action-buttons">
<button class="chat-again-btn" onclick="showOptionsAgain()">
<i class="fa fa-rotate-right"></i> ${LANG[currentLang].chatAgain}
</button>
<button class="employee-btn" onclick="openWhatsApp()">
<i class="fab fa-whatsapp"></i> ${LANG[currentLang].employee}
</button>
</div>
</div>
`;
speak(answer);
chat.scrollTop = chat.scrollHeight;
},500);
}

document.getElementById("question").addEventListener("keydown", function(e){
if(e.key === "Enter") sendMessage();
});

function openWhatsApp(){
window.open("https://wa.me/919435818872","_blank");
}

function showTyping(){
const chat = document.getElementById("chat");
chat.innerHTML += `
<div class="message bot typing" id="typing">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
`;
chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
const t = document.getElementById("typing");
if(t) t.remove();
}

function speak(text){
const cleanText = String(text || "").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
if(!cleanText) return;
if(sendToApp({type:"SPEAK_TEXT", text:cleanText, lang:currentLang})) return;
try{
window.speechSynthesis.cancel();
const msg = new SpeechSynthesisUtterance(cleanText);
msg.lang = currentLang === "en" ? "en-US" : "hi-IN";
msg.rate = 1;
msg.pitch = 1;
window.speechSynthesis.speak(msg);
}catch(e){}
}

function stopVoice(){
sendToApp({type:"STOP_SPEAK"});
try{ window.speechSynthesis.cancel(); }catch(e){}
}

window.setLang = setLang;
window.ask = ask;
window.sendMessage = sendMessage;
window.showOptionsAgain = showOptionsAgain;
window.openWhatsApp = openWhatsApp;
window.stopVoice = stopVoice;
window.appBack = appBack;

window.addEventListener("dreamlinerAppBack", stopVoice);
window.addEventListener("beforeunload", stopVoice);
window.addEventListener("pagehide", stopVoice);
window.addEventListener("blur", stopVoice);
document.addEventListener("visibilitychange", function(){ if(document.hidden) stopVoice(); });

loadUI();
</script>
</body>
</html>
