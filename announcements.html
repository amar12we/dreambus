<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements | Dreamliner</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --orange:#ff7a00;
    --deep-orange:#ff5b1a;
    --soft-orange:#fff4e8;
    --bg:#f6f7f9;
    --text:#202124;
    --muted:#737780;
    --white:#ffffff;
    --border:#e8eaed;
    --card-shadow:0 3px 14px rgba(15,23,42,.07);
    --green:#128a45;
    --red:#c62828;
    --blue:#1f5fbf;
}

body{
    min-height:100vh;
    background:
        linear-gradient(180deg,#ff7a00 0%,#ff8420 78px,#f6f7f9 78px,#f6f7f9 100%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    padding-bottom:26px;
}

.header{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    color:white;
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(135deg,#ff7a00,#ff5b1a);
    box-shadow:0 4px 14px rgba(0,0,0,.13);
}

.back-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.24);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:15px;
}

.header-title{
    text-align:center;
}

.header-title h1{
    font-size:17px;
    font-weight:750;
    letter-spacing:.1px;
}

.header-title p{
    font-size:11.5px;
    opacity:.92;
    margin-top:2px;
    font-weight:400;
}

.header-space{
    width:38px;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:15px 14px 34px;
}

.page-intro{
    background:var(--white);
    border:1px solid rgba(255,255,255,.85);
    border-radius:18px;
    padding:16px 16px 15px;
    margin-bottom:12px;
    box-shadow:0 8px 20px rgba(112,59,0,.12);
}

.intro-top{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:8px;
}

.intro-symbol{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#fff1e3;
    color:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #ffe0bf;
    font-size:16px;
    flex-shrink:0;
}

.page-intro h2{
    font-size:18px;
    font-weight:760;
    letter-spacing:-.15px;
}

.page-intro p{
    font-size:13.2px;
    color:#666b74;
    line-height:1.48;
}

.notice-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#fffaf5;
    border:1px solid #ffe1c2;
    border-radius:15px;
    padding:11px 13px;
    margin-bottom:14px;
}

.notice-strip-left{
    display:flex;
    align-items:center;
    gap:9px;
    color:#7a440d;
    min-width:0;
}

.notice-strip-left i{
    color:var(--orange);
    font-size:14px;
}

.notice-strip-left span{
    font-size:13px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.notice-strip-count{
    font-size:12px;
    color:#8a5b2d;
    background:#fff;
    border:1px solid #ffe0c2;
    padding:6px 10px;
    border-radius:999px;
    white-space:nowrap;
}

.announcement-list{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.announcement{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:17px;
    padding:15px 15px 14px;
    box-shadow:var(--card-shadow);
    position:relative;
    overflow:hidden;
}

.announcement{
    background:#fff;
    border:1px solid #ececec;
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    transition:.2s ease;
}

.announcement:hover{
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    transform:translateY(-2px);
}

.announcement-head{
    display:flex;
    align-items:flex-start;
    gap:11px;
}

.announce-symbol{
    width:34px;
    height:34px;
    border-radius:11px;
    background:#fff4e8;
    border:1px solid #ffe1c2;
    color:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:14px;
}

.announcement.important .announce-symbol{
    background:#fff3f3;
    border-color:#ffd6d6;
    color:var(--red);
}

.announcement.update .announce-symbol{
    background:#effaf3;
    border-color:#cdeed8;
    color:var(--green);
}

.announce-content{
    flex:1;
    min-width:0;
}

.type-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:3px;
}

.type-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.6px;
    font-weight:800;
    color:#9a6a37;
}

.announcement.important .type-label{
    color:var(--red);
}

.announcement.update .type-label{
    color:var(--green);
}

.new-tag{
    display:none;
    font-size:10px;
    font-weight:800;
    color:white;
    background:var(--orange);
    padding:4px 8px;
    border-radius:999px;
    white-space:nowrap;
}

.announcement:first-child .new-tag{
    display:inline-flex;
}

.announcement h3{
    font-size:15.5px;
    font-weight:750;
    line-height:1.35;
    letter-spacing:-.05px;
    margin-bottom:7px;
}

.announcement p{
    font-size:13.65px;
    line-height:1.58;
    color:#4d5560;
    white-space:pre-line;
}

.meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
    padding-top:11px;
    border-top:1px solid #f0f1f3;
    font-size:12px;
    color:var(--muted);
}

.meta-left,
.meta-right{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
}

.meta i{
    color:var(--orange);
    font-size:12px;
}

.meta-left span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.loading,
.empty{
    background:white;
    border:1px solid var(--border);
    border-radius:17px;
    padding:30px 18px;
    text-align:center;
    color:var(--muted);
    box-shadow:var(--card-shadow);
}

.loading i{
    font-size:24px;
    color:var(--orange);
    animation:spin .9s linear infinite;
    margin-bottom:12px;
}

.empty i{
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#fff4e8;
    border:1px solid #ffe1c2;
    color:var(--orange);
    margin-bottom:12px;
    font-size:17px;
}

.empty h3{
    font-size:16px;
    color:var(--text);
    margin-bottom:6px;
    font-weight:750;
}

.empty p,
.loading p{
    font-size:13px;
    line-height:1.45;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.footer{
    text-align:center;
    color:#8b8b8b;
    font-size:12px;
    padding-top:20px;
}

@media(max-width:520px){
    .container{
        padding:13px 12px 28px;
    }

    .page-intro{
        border-radius:16px;
        padding:15px;
    }

    .page-intro h2{
        font-size:17px;
    }

    .notice-strip{
        border-radius:14px;
        padding:10px 11px;
    }

    .notice-strip-left span{
        font-size:12.5px;
    }

    .announcement{
        border-radius:16px;
        padding:14px 13px 13px;
    }

    .announcement-head{
        gap:10px;
    }

    .announce-symbol{
        width:32px;
        height:32px;
        border-radius:10px;
    }

    .announcement h3{
        font-size:15px;
    }

    .announcement p{
        font-size:13.35px;
    }

    .meta{
        align-items:flex-start;
        flex-direction:column;
        gap:6px;
    }
}
</style>
</head>

<body>

<header class="header">
    <button class="back-btn" onclick="window.history.back()">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="header-title">
        <h1>Announcements</h1>
        <p>Dreamliner passenger updates</p>
    </div>

    <div class="header-space"></div>
</header>

<main class="container">

    <section class="page-intro">
        <div class="intro-top">
            <div class="intro-symbol">
                <i class="fa-solid fa-bullhorn"></i>
            </div>
            <h2>Latest Dreamliner Updates</h2>
        </div>
        <p>Important route notices, timing changes, offers and passenger information posted by Dreamliner will appear here.</p>
    </section>

    <div class="notice-strip">
        <div class="notice-strip-left">
            <i class="fa-solid fa-circle-info"></i>
            <span id="latestInfo">Checking latest announcements</span>
        </div>
        <div class="notice-strip-count" id="countText">Loading...</div>
    </div>

    <div class="announcement-list" id="announcementList">
        <div class="loading">
            <i class="fa-solid fa-circle-notch"></i>
            <p>Loading announcements...</p>
        </div>
    </div>

    <div class="footer">
        © 2026 Dreamliner Bus
    </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey:"AIzaSyCHkQ5k5wKEommWakTm09mCtcJxsRdgJIk",
    authDomain:"dreamliner-421b0.firebaseapp.com",
    projectId:"dreamliner-421b0",
    storageBucket:"dreamliner-421b0.appspot.com",
    messagingSenderId:"454472970770",
    appId:"1:454472970770:web:cbf95c8b7523f24f2b5ecb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("announcementList");
const countText = document.getElementById("countText");
const latestInfo = document.getElementById("latestInfo");

function escapeHTML(text = ""){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function getDateObject(value){
    if(!value) return null;
    let date;
    if(value.toDate){
        date = value.toDate();
    }else{
        date = new Date(value);
    }
    return isNaN(date.getTime()) ? null : date;
}

function formatDate(value){
    const date = getDateObject(value);
    if(!date) return "Recently posted";

    return date.toLocaleString("en-IN", {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        hour12:true
    });
}

function formatRelativeTime(value){
    const date = getDateObject(value);
    if(!date) return "Recently";

    const diff = Date.now() - date.getTime();
    const minute = 60 * 1000;
    const hour = 60 * minute;
    const day = 24 * hour;

    if(diff < minute) return "Just now";
    if(diff < hour) return `${Math.floor(diff / minute)} min ago`;
    if(diff < day) return `${Math.floor(diff / hour)} hr ago`;
    if(diff < day * 7) return `${Math.floor(diff / day)} days ago`;

    return date.toLocaleDateString("en-IN", {
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function typeLabel(type){
    if(type === "important") return "Important Notice";
    if(type === "update") return "Service Update";
    if(type === "offer") return "Travel Offer";
    if(type === "delay") return "Delay Notice";
    return "Official Notice";
}

function iconForType(type){
    if(type === "important") return "fa-triangle-exclamation";
    if(type === "update") return "fa-rotate";
    if(type === "offer") return "fa-ticket";
    if(type === "delay") return "fa-clock";
    return "fa-bullhorn";
}

function normalizedType(type){
    if(["important", "update", "offer", "delay"].includes(type)) return type;
    return "normal";
}

function saveSeenAnnouncements(items){
    const ids = items.map(item => item.id);
    localStorage.setItem("seenAnnouncements", JSON.stringify(ids));
    if(ids[0]) localStorage.setItem("lastSeenAnnouncementId", ids[0]);
}

function renderAnnouncements(items){
    if(items.length === 0){
        countText.textContent = "0 updates";
        latestInfo.textContent = "No announcements posted yet";

        list.innerHTML = `
            <div class="empty">
                <i class="fa-regular fa-bell"></i>
                <h3>No announcements yet</h3>
                <p>New Dreamliner updates will appear here when available.</p>
            </div>
        `;
        saveSeenAnnouncements(items);
        return;
    }

    countText.textContent = `${items.length} update${items.length > 1 ? "s" : ""}`;
    latestInfo.textContent = `Latest posted ${formatRelativeTime(items[0].createdAt || items[0].date || items[0].timestamp)}`;

    list.innerHTML = items.map((item, index) => {
        const type = normalizedType(item.type || "normal");
        const postedValue = item.createdAt || item.date || item.timestamp;
        const message = item.message || item.description || "";

        return `
            <article class="announcement ${type}">
                <div class="announcement-head">
                    <div class="announce-symbol">
                        <i class="fa-solid ${iconForType(type)}"></i>
                    </div>

                    <div class="announce-content">
                        <div class="type-line">
                            <span class="type-label">${typeLabel(type)}</span>
                            <span class="new-tag">Latest</span>
                        </div>

                        <h3>${escapeHTML(item.title || "Dreamliner Update")}</h3>
                        <p>${escapeHTML(message)}</p>

                        <div class="meta">
                            <div class="meta-left">
                                <i class="fa-regular fa-calendar"></i>
                                <span>${formatDate(postedValue)}</span>
                            </div>
                            <div class="meta-right">
                                <i class="fa-regular fa-clock"></i>
                                <span>${formatRelativeTime(postedValue)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        `;
    }).join("");

    saveSeenAnnouncements(items);
}

const q = query(
    collection(db, "announcements"),
    orderBy("createdAt", "desc")
);

onSnapshot(q, snapshot => {
    const items = [];

    snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if(data.active === false) return;

        items.push({
            id: docSnap.id,
            ...data
        });
    });

    renderAnnouncements(items);
}, error => {
    console.error(error);

    countText.textContent = "Unable to load";
    latestInfo.textContent = "Please check your connection";

    list.innerHTML = `
        <div class="empty">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Could not load announcements</h3>
            <p>Please check Firebase config, Firestore rules, or internet connection.</p>
        </div>
    `;
});
</script>

</body>
</html>
